<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu Feel Demo</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      gap: 48px;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f7fa;
    }
    .menu-wrapper { position: relative; display: inline-block; }
    .menu-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 16px; font-size: 14px; font-weight: 600;
      color: #1e293b; background: #ffffff;
      border: 1px solid #cbd5e1; border-radius: 8px; cursor: pointer;
      touch-action: manipulation;
    }
    .menu-btn:hover { background: #f8fafc; }
    .arrow { display: inline-block; transition: transform 0.2s ease; }
    .menu-wrapper.open .arrow { transform: rotate(180deg); }
    .menu-list {
      display: none; position: absolute; left: 0;
      min-width: 180px; padding: 6px 0; margin: 0; list-style: none;
      background: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.1); z-index: 10;
    }
    .dropdown .menu-list { top: calc(100% + 6px); }
    .dropup .menu-list { bottom: calc(100% + 6px); }
    .menu-wrapper.open .menu-list { display: block; }
    .menu-list li a {
      display: block; padding: 8px 14px; color: #334155;
      text-decoration: none; font-size: 14px;
    }
    .menu-list li a:hover { background: #f1f5f9; color: #0f172a; }
  </style>
</head>
<body>
  <div class="menu-wrapper dropdown" id="dropdownMenu">
    <button type="button" class="menu-btn" aria-expanded="false">
      <span>Drop-Down</span>
      <span class="arrow">▼</span>
    </button>
    <ul class="menu-list">
      <li><a href="#profile">Profile</a></li>
      <li><a href="#settings">Settings</a></li>
      <li><a href="#logout">Sign out</a></li>
    </ul>
  </div>

  <div class="menu-wrapper dropup" id="dropupMenu">
    <button type="button" class="menu-btn" aria-expanded="false">
      <span>Drop-Up</span>
      <span class="arrow">▲</span>
    </button>
    <ul class="menu-list">
      <li><a href="#help">Help Center</a></li>
      <li><a href="#status">System Status</a></li>
      <li><a href="#feedback">Send Feedback</a></li>
    </ul>
  </div>

  <script>
    document.querySelectorAll(".menu-wrapper").forEach((wrapper) => {
      const btn = wrapper.querySelector(".menu-btn");
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const isOpen = wrapper.classList.toggle("open");
        btn.setAttribute("aria-expanded", String(isOpen));
      });
    });
    document.addEventListener("click", () => {
      document.querySelectorAll(".menu-wrapper.open").forEach((wrapper) => {
        wrapper.classList.remove("open");
        wrapper.querySelector(".menu-btn").setAttribute("aria-expanded", "false");
      });
    });
  </script>
</body>
</html>

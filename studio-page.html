<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Studio Page</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#8a8f96;
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none}
  #pad{position:relative;width:100vw;height:100vh;background:#f2f0ec;touch-action:none}
  .blk{position:fixed;z-index:5;min-width:56px;height:40px;padding:0 12px;
    border-radius:10px;background:#3b4048;color:#f2f0ec;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;letter-spacing:.4px;box-shadow:0 2px 6px rgba(0,0,0,.35);
    touch-action:none;cursor:pointer}
  .blk.pend{background:#f2f0ec;color:#3b4048;border:2px dashed #3b4048;box-shadow:none}
  .blk.act{background:#e2653c}
  .pop{position:fixed;z-index:9;min-width:120px;background:#fff;border:2px solid #3b4048;
    border-radius:12px;padding:8px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
  .pop .row{padding:8px 10px;margin:3px 0;border-radius:8px;background:#e9e6e1;
    font-size:12px;color:#26292e}
  #reset{position:fixed;right:8px;top:8px;z-index:20;font-size:10px;color:#3b4048;
    background:rgba(242,240,236,.7);border:1px solid #3b4048;border-radius:8px;
    padding:4px 8px}
  #hint{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:20;
    font-size:10px;color:#7c7f85}
</style>
</head>
<body>
<div id="pad"></div>
<button id="RESET">reset</button>
<div id="hint">tap = what it opens · drag = move</div>
<script>
const PADW=()=>window.innerWidth, PADH=()=>window.innerHeight;

const DEFS=[
 {id:'pen',   t:'PEN',    x:.02,  y:.02,  pop:['PENS LIST','+ ADD PEN','CREATE PEN','RESET PEN','PEN TIPS','SMOOTHING 2.1']},
 {id:'erz',   t:'ERASER', x:.16,  y:.02,  pop:['SIZE','MATERIAL','EDGE','+ ADD','STAMP SHAPES']},
 {id:'lay',   t:'LAYERS', x:.30,  y:.02,  pop:['EYE','LOCK','MOVE UP','MOVE DOWN']},
 {id:'undo',  t:'UNDO',   x:.46,  y:.02,  pop:null},
 {id:'redo',  t:'REDO',   x:.58,  y:.02,  pop:null},
 {id:'menu',  t:'MENU',   x:.92,  y:.02,  pop:['HOME','STUDIO','FONT STUDIO','PROJECTS','IMPORT & EXPORT']},
 {id:'col',   t:'COLOUR', x:.02,  y:.30,  pop:['WHEEL','PALETTE','# HEX','FINISH: FLAT / METAL / GEM']},
 {id:'rub',   t:'RUB',    x:.02,  y:.46,  pop:null, action:'toggle'},
 {id:'share', t:'SHARE',  x:.92,  y:.30,  pop:['SAVE','SAVE AS','PNG','JPG','SVG','STL']},
 {id:'imp',   t:'IMPORT', x:.92,  y:.50,  pop:['FROM FILES','SVG = TRUE LINES','JPG/PNG = PICTURE']},
 {id:'clr',   t:'CLEAR',  x:.92,  y:.70,  pop:null, pend:1},
 {id:'tool',  t:'TOOLS',  x:.45,  y:.90,  pop:['CREATE  (draws)','EDIT  (fixes)']}
];
const KEY='studiopage.v2';
let saved={};
try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){saved={}}

const blocks={};
const pad=document.getElementById('pad');

function make(d){
  const b=document.createElement('div');
  b.className='blk'+(d.round?' round':'')+(d.pend?' pend':'');
  b.textContent=d.t;
  const px= saved[d.id] ? Math.min(saved[d.id].x,PADW()-60) : Math.round(d.x*PADW());
  const py= saved[d.id] ? Math.min(saved[d.id].y,PADH()-56) : Math.round(d.y*PADH());
  b.style.left=px+'px'; b.style.top=py+'px';
  pad.appendChild(b);
  blocks[d.id]={el:b,pop:null};
  bind(b,d);
}
function closePops(except){
  for(const k in blocks){const o=blocks[k];
    if(o.pop && o.pop!==except){o.pop.remove();o.pop=null}}
}
function openPop(b,d){
  const p=document.createElement('div');
  p.className='pop';
  d.pop.forEach(t=>{const r=document.createElement('div');
    r.className='row';r.textContent=t;p.appendChild(r)});
  pad.appendChild(p); blocks[b.dataset.id].pop=p;
  const r=b.getBoundingClientRect();
  let lx=r.left, ly=r.top - (p.offsetHeight+10);
  if(ly<8) ly=r.top+r.height+8;
  lx=Math.min(Math.max(8,lx),PADW()-p.offsetWidth-8);
  p.style.left=lx+'px'; p.style.top=ly+'px';
}
function bind(b,d){
  let sx=0,sy=0,ox=0,oy=0,moved=false,down=false;
  b.addEventListener('pointerdown',e=>{
    b.setPointerCapture(e.pointerId);
    down=true;moved=false;
    sx=e.clientX;sy=e.clientY;
    ox=parseFloat(b.style.left);oy=parseFloat(b.style.top);
    closePops();
  });
  b.addEventListener('pointermove',e=>{
    if(!down)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)>8||Math.abs(dy)>8)moved=true;
    if(moved){
      let nx=ox+dx,ny=oy+dy;
      nx=Math.min(Math.max(4,nx),PADW()-b.offsetWidth-4);
      ny=Math.min(Math.max(4,ny),PADH()-b.offsetHeight-4);
      b.style.left=nx+'px';b.style.top=ny+'px';
    }
  });
  function up(e){
    if(!down)return;down=false;
    if(moved){
      saved[b.dataset.id]={x:parseFloat(b.style.left),y:parseFloat(b.style.top)};
      localStorage.setItem(KEY,JSON.stringify(saved));
    }else{
      const o=blocks[b.dataset.id];
      if(o.pop){o.pop.remove();o.pop=null;return}
      if(d.action==='toggle'){b.classList.toggle('act');return}
      if(d.pop)openPop(b,d);
    }
  }
  b.addEventListener('pointerup',up);
  b.addEventListener('pointercancel',()=>{down=false});
}
DEFS.forEach(make);

document.getElementById('RESET').addEventListener('click',()=>{
  localStorage.removeItem(KEY);
  for(const k in blocks)blocks[k].el.remove();
  Object.keys(blocks).forEach(k=>delete blocks[k]);
  for(const k in saved)delete saved[k];
  DEFS.forEach(make);
});
window.addEventListener('resize',()=>{
  for(const k in blocks){
    const b=blocks[k].el;
    b.style.left=Math.min(Math.max(4,parseFloat(b.style.left)),PADW()-b.offsetWidth-4)+'px';
    b.style.top =Math.min(Math.max(4,parseFloat(b.style.top)), PADH()-b.offsetHeight-4)+'px';
  }
  closePops();
});
</script>
</body>
</html>

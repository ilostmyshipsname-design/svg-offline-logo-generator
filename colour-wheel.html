<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Wheel — park half-off and turn</title>
<style>
 html,body{margin:0;height:100%;overflow:hidden;background:#9aa0a5;
   font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none}
 svg{position:fixed;touch-action:none}
 .petal{transform-box:view-box;transform-origin:150px 150px}
 #tab{position:fixed;width:44px;height:26px;background:#f2f0ec;border:1px solid #9a958d;
   border-radius:8px;z-index:5;display:none;align-items:center;justify-content:center;gap:4px;
   box-shadow:0 1px 4px rgba(0,0,0,.2);touch-action:none;cursor:grab}
 #tab i{width:4px;height:4px;border-radius:50%;background:#6d6a64;display:block}
</style>
</head>
<body>

<svg id="w" width="300" height="300" viewBox="0 0 300 300">
 <g id="pet"></g>
</svg>

<div id="tab"><i></i><i></i><i></i></div>

<script>
 var NS='http://www.w3.org/2000/svg';
 var svg=document.getElementById('w');
 var pet=document.getElementById('pet');
 var tab=document.getElementById('tab');
 var N=16, STEP=360/N, r0=32, r1=124, CX=150, CY=150;
 var cols=['#0d0c0b','#262019','#2c2f3a','#3a332a'];
 for(var i=0;i<12;i++)cols.push('hsl('+i*30+', 65%, 46%)');
 function P(r,a){a*=Math.PI/180;return (CX+r*Math.cos(a)).toFixed(2)+' '+(CY+r*Math.sin(a)).toFixed(2)}
 for(var i=0;i<N;i++){
   var a=i*30-90;
   var p=document.createElementNS(NS,'path');
   p.setAttribute('class','petal');
   p.setAttribute('d','M'+P(r1,a-STEP/2+.4)+' A'+r1+' '+r1+' 0 0 1 '+P(r1,a+STEP/2-.4)+
     ' L'+P(r0,a+STEP/2-.4)+' A'+r0+' '+r0+' 0 0 0 '+P(r0,a-STEP/2+.4)+' Z');
   p.setAttribute('fill',cols[i]);
   p.setAttribute('stroke','rgba(255,255,255,.30)');
   p.setAttribute('stroke-width','1');
   p.style.transform='rotate('+(i*30)+'deg) scale(1)';
   pet.appendChild(p);
 }

 var KEY='colourwheel.v1';
 var open=false, rot=0, drag=null, tdrag=null;
 var openScale=1, restScale=0.22;
 var R={x:innerWidth/2,y:innerHeight/2};
 var O={x:innerWidth/2,y:innerHeight/2};
 var fresh=true;
 try{var sv=JSON.parse(localStorage.getItem(KEY)||'null');
   if(sv&&sv.rx!==undefined){
     R={x:sv.rx,y:sv.ry}; O={x:sv.ox,y:sv.oy};
     openScale=sv.s||1; rot=sv.rot||0; open=!!sv.open; fresh=false;
   }
 }catch(e){}

 function fitO(x,y){
   var exc=r1-60;
   return {x:Math.max(-exc,Math.min(innerWidth+exc,x)),
           y:Math.max(-exc,Math.min(innerHeight+exc,y))};
 }
 function clampR(x,y){
   return {x:Math.max(30,Math.min(innerWidth-30,x)),
           y:Math.max(30,Math.min(innerHeight-30,y))};
 }
 function cur(){return open?O:R}
 function pin(){try{localStorage.setItem(KEY,JSON.stringify(
   {rx:R.x,ry:R.y,ox:O.x,oy:O.y,s:openScale,rot:Math.round(rot),open:open}))}catch(e){}}
 function place(){
   var p=cur();
   svg.style.left=(p.x-CX)+'px'; svg.style.top=(p.y-CY)+'px';
   svg.style.transform='scale('+(open?openScale:restScale)+')';
   var rr=r1*openScale;
   tab.style.display=open?'flex':'none';
   if(open){
     var tx=Math.max(24,Math.min(innerWidth-24,O.x));
     var ty=O.y+rr+16;
     if(ty>innerHeight-44) ty=O.y-rr-46;
     tab.style.left=(tx-22)+'px'; tab.style.top=ty+'px';
   }
 }
 function look(){
   svg.style.transition='left .5s ease, top .5s ease, transform .5s cubic-bezier(.34,1.45,.45,1)';
   place();
   pin();
 }
 look(); if(fresh)pin();

 function angAt(x,y){
   var b=svg.getBoundingClientRect();
   return Math.atan2(y-(b.top+CY), x-(b.left+CX))*180/Math.PI;
 }
 svg.addEventListener('pointerdown',function(e){
   e.preventDefault();
   var mode=open?'turn':'carry';
   drag={x:e.clientX,y:e.clientY,cx:cur().x,cy:cur().y,rot0:rot,moved:false,mode:mode};
   try{svg.setPointerCapture(e.pointerId)}catch(_){}
 });
 svg.addEventListener('pointermove',function(e){
   if(!drag)return;
   if(!drag.moved&&Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>8)drag.moved=true;
   if(!drag.moved)return;
   if(drag.mode==='turn'){
     var d=angAt(e.clientX,e.clientY)-angAt(drag.x,drag.y);
     rot=drag.rot0+d;
     pet.setAttribute('transform','rotate('+rot.toFixed(2)+' '+CX+' '+CY+')');
   } else {
     svg.style.transition='none';
     R=clampR(drag.cx+(e.clientX-drag.x), drag.cy+(e.clientY-drag.y));
     place(); pin();
   }
 });
 function up(e){
   if(!drag)return;
   if(!drag.moved&&!open){
     open=true; O=fitO(R.x,R.y); look();
   } else if(drag.moved){ pin(); }
   drag=null;
 }
 svg.addEventListener('pointerup',up);
 svg.addEventListener('pointercancel',function(){drag=null});
 document.body.addEventListener('pointerup',function(e){
   if(!open||drag)return;
   if(e.target!==svg&&!svg.contains(e.target)&&
      e.target!==tab&&!tab.contains(e.target)){
     open=false; look();
   }
 });

 tab.addEventListener('pointerdown',function(e){
   e.preventDefault();
   tdrag={x:e.clientX,y:e.clientY,ox:O.x,oy:O.y,moved:false};
   try{tab.setPointerCapture(e.pointerId)}catch(_){}
 });
 tab.addEventListener('pointermove',function(e){
   if(!tdrag)return;
   if(!tdrag.moved&&Math.abs(e.clientX-tdrag.x)+Math.abs(e.clientY-tdrag.y)>8)tdrag.moved=true;
   if(!tdrag.moved)return;
   svg.style.transition='none';
   O=fitO(tdrag.ox+(e.clientX-tdrag.x), tdrag.oy+(e.clientY-tdrag.y));
   place(); pin();
 });
 ['pointerup','pointercancel'].forEach(function(ev){
   tab.addEventListener(ev,function(){
     if(tdrag&&tdrag.moved)pin();
     tdrag=null;
   });
 });

 window.addEventListener('resize',function(){
   O=fitO(O.x,O.y);
   R=clampR(R.x,R.y);
   place(); pin();
 });
</script>
</body>
</html>

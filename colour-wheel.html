<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Wheel — park half-off and turn</title>
<style>
 html,body{margin:0;height:100%;overflow:hidden;background:#9aa0a5;
   font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none}
 svg{position:fixed;left:0;top:0;touch-action:none}
 .petal{transform-box:view-box;transform-origin:150px 150px}
 #pet{transform-box:view-box;transform-origin:150px 150px;will-change:transform}
 #tab{position:fixed;left:0;top:0;width:44px;height:26px;background:#f2f0ec;border:1px solid #9a958d;
   border-radius:8px;z-index:5;display:flex;align-items:center;justify-content:center;gap:4px;
   box-shadow:0 1px 4px rgba(0,0,0,.2);touch-action:none;cursor:grab}
 #tab i{width:4px;height:4px;border-radius:50%;background:#6d6a64;display:block}
</style>
</head>
<body>

<svg id="w" width="300" height="300" viewBox="0 0 300 300">
 <g id="pet"></g>
</svg>

<div id="tab"><i></i><i></i><i></i></div>

<script>
 var NS='http://www.w3.org/2000/svg';
 var svg=document.getElementById('w');
 var pet=document.getElementById('pet');
 var tab=document.getElementById('tab');
 var N=16, STEP=360/N, r0=32, r1=124, CX=150, CY=150;
 var cols=['#0d0c0b','#262019','#2c2f3a','#3a332a'];
 for(var i=0;i<12;i++)cols.push('hsl('+i*30+', 65%, 46%)');
 function P(r,a){a*=Math.PI/180;return (CX+r*Math.cos(a)).toFixed(2)+' '+(CY+r*Math.sin(a)).toFixed(2)}
 for(var i=0;i<N;i++){
   var a=i*30-90;
   var p=document.createElementNS(NS,'path');
   p.setAttribute('class','petal');
   p.setAttribute('d','M'+P(r1,a-STEP/2+.4)+' A'+r1+' '+r1+' 0 0 1 '+P(r1,a+STEP/2-.4)+
     ' L'+P(r0,a+STEP/2-.4)+' A'+r0+' '+r0+' 0 0 0 '+P(r0,a-STEP/2+.4)+' Z');
   p.setAttribute('fill',cols[i]);
   p.setAttribute('stroke','rgba(255,255,255,.30)');
   p.setAttribute('stroke-width','1');
   p.style.transform='rotate('+(i*30)+'deg) scale(1)';
   pet.appendChild(p);
 }

 var KEY='colourwheel.v1';
 var rot=0, drag=null, tdrag=null, s=0.6;
 var pointers={}, pinch=null;
 var R={x:innerWidth/2,y:innerHeight/2};
 var fresh=true;
 try{var sv=JSON.parse(localStorage.getItem(KEY)||'null');
   if(sv&&sv.x!==undefined){
     R={x:sv.x,y:sv.y}; s=sv.s||0.6; rot=sv.rot||0; fresh=false;
   } else if(sv&&sv.rx!==undefined){
     R={x:sv.open?sv.ox:sv.rx, y:sv.open?sv.oy:sv.ry};
     s=sv.open?(sv.s||1):0.6; rot=sv.rot||0; fresh=false;
   }
 }catch(e){}

 function fit(x,y){
   var exc=r1*s-28;
   return {x:Math.max(-exc,Math.min(innerWidth+exc,x)),
           y:Math.max(-exc,Math.min(innerHeight+exc,y))};
 }
 function pin(){try{localStorage.setItem(KEY,JSON.stringify(
   {x:R.x,y:R.y,s:s,rot:Math.round(rot)}))}catch(e){}}
 var PX=null, PY=null, ss=0.6;
 function apply(){
   svg.style.transform='translate('+(PX-CX)+'px,'+(PY-CY)+'px) scale('+ss+')';
   var tx=Math.max(24,Math.min(innerWidth-24,PX));
   var ty=PY+r1*s+16;
   if(ty>innerHeight-40) ty=PY-r1*s-42;
   tab.style.transform='translate('+(tx-22)+'px,'+ty+'px)';
 }
 function place(){
   if(PX===null){PX=R.x; PY=R.y;}
   ss=s;
   apply();
 }
 function look(){
   svg.style.transition='transform .5s cubic-bezier(.34,1.45,.45,1)';
   place();
   pin();
 }
 look(); if(fresh)pin();
 var shown=null;
 function spin(){
   if(shown===null){ shown=rot; pet.style.transform='rotate('+rot.toFixed(2)+'deg)'; }
   else{
     var diff=rot-shown;
     if(Math.abs(diff)>0.05){
       shown+=diff*0.30;
       pet.style.transform='rotate('+shown.toFixed(2)+'deg)';
     }
   }
   if(PX!==null){
     var moved=false;
     var dx=R.x-PX, dy=R.y-PY;
     if(Math.abs(dx)+Math.abs(dy)>0.5){
       PX+=dx*0.30; PY+=dy*0.30; moved=true;
     }
     var ds=s-ss;
     if(Math.abs(ds)>0.001){ ss+=ds*0.30; moved=true; }
     if(moved)apply();
   }
   requestAnimationFrame(spin);
 }
 requestAnimationFrame(spin);

 function ang2(x,y,cx,cy){return Math.atan2(y-cy, x-cx)*180/Math.PI}
 svg.addEventListener('pointerdown',function(e){
   e.preventDefault();
   try{svg.setPointerCapture(e.pointerId)}catch(_){}
   pointers[e.pointerId]={x:e.clientX,y:e.clientY};
   if(Object.keys(pointers).length===2){
     drag=null;
     pinch={d0:Math.max(pDist(),60),s0:s};
     svg.style.transition='none';
     return;
   }
   drag={x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY,moved:false};
 });
 function pDist(){
   var k=Object.keys(pointers);
   return Math.hypot(pointers[k[0]].x-pointers[k[1]].x, pointers[k[0]].y-pointers[k[1]].y);
 }
 svg.addEventListener('pointermove',function(e){
   if(pinch){
     if(pointers[e.pointerId]!==undefined)pointers[e.pointerId]={x:e.clientX,y:e.clientY};
     var k=Object.keys(pointers);
     if(k.length>=2){
       var d=Math.hypot(pointers[k[0]].x-pointers[k[1]].x, pointers[k[0]].y-pointers[k[1]].y);
       s=Math.max(0.6,Math.min(2.5,pinch.s0*d/pinch.d0));
       place(); pin();
     }
     return;
   }
   if(!drag)return;
   if(!drag.moved&&Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>8)drag.moved=true;
   if(!drag.moved)return;
   var b=svg.getBoundingClientRect(), scx=b.left+b.width/2, scy=b.top+b.height/2;
   var r1d=Math.hypot(e.clientX-scx,e.clientY-scy), r0d=Math.hypot(drag.px-scx,drag.py-scy);
   if(r1d>30&&r0d>30){
     var d=ang2(e.clientX,e.clientY,scx,scy)-ang2(drag.px,drag.py,scx,scy);
     if(d>180)d-=360; if(d<-180)d+=360;
     rot+=d;
   }
   drag.px=e.clientX; drag.py=e.clientY;
 });
 function up(e){
   delete pointers[e.pointerId];
   if(pinch){
     if(Object.keys(pointers).length<2){
       pinch=null;
       svg.style.transition='transform .5s cubic-bezier(.34,1.45,.45,1)';
       pin();
     }
     return;
   }
   if(!drag)return;
   if(drag.moved)pin();
   drag=null;
 }
 svg.addEventListener('pointerup',up);
 svg.addEventListener('pointercancel',function(e){
   delete pointers[e.pointerId];
   pinch=null; drag=null;
 });

 tab.addEventListener('pointerdown',function(e){
   e.preventDefault();
   tdrag={x:e.clientX,y:e.clientY,ox:R.x,oy:R.y,moved:false};
   try{tab.setPointerCapture(e.pointerId)}catch(_){}
 });
 tab.addEventListener('pointermove',function(e){
   if(!tdrag)return;
   if(!tdrag.moved&&Math.abs(e.clientX-tdrag.x)+Math.abs(e.clientY-tdrag.y)>8)tdrag.moved=true;
   if(!tdrag.moved)return;
   svg.style.transition='none';
   R=fit(tdrag.ox+(e.clientX-tdrag.x), tdrag.oy+(e.clientY-tdrag.y));
   pin();
 });
 ['pointerup','pointercancel'].forEach(function(ev){
   tab.addEventListener(ev,function(){
     if(tdrag&&tdrag.moved)pin();
     tdrag=null;
   });
 });

 window.addEventListener('resize',function(){
   R=fit(R.x,R.y);
   place(); pin();
 });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Wheel — unfold and turn</title>
<style>
 html,body{margin:0;height:100%;overflow:hidden;background:#9aa0a5;
   font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none}
 svg{position:fixed;touch-action:none}
 .petal{transform-box:view-box;transform-origin:150px 150px}
 #marker{pointer-events:none;transition:opacity .3s ease}
 #hub{cursor:pointer}
 .sizes{position:fixed;top:20px;left:20px;display:flex;gap:12px;z-index:5}
 .s{width:22px;height:22px;border-radius:50%;border:1px solid #7d8288;background:#f2f0ec;cursor:pointer;box-sizing:border-box}
 .s.onq{outline:2px solid #3c3a36;outline-offset:1px}
 #sel{position:fixed;display:none;border:2px dashed #3c3a36;border-radius:16px;z-index:6;box-sizing:border-box}
 #sel.onq{display:block}
 #grip{position:absolute;right:-11px;bottom:-11px;width:22px;height:22px;border-radius:7px;
   background:#f2f0ec;border:2px solid #3c3a36;box-sizing:border-box;touch-action:none}
 #fx{position:absolute;right:-11px;top:-11px;width:22px;height:22px;border-radius:50%;
   background:#f2f0ec;border:2px solid #3c3a36;color:#3c3a36;font-size:12px;
   display:flex;align-items:center;justify-content:center;cursor:pointer;box-sizing:border-box}
</style>
</head>
<body>

<svg id="w" width="300" height="300" viewBox="0 0 300 300">
 <g id="pet"></g>
 <circle id="cz" cx="150" cy="150" r="36" fill="transparent"/>
 <circle id="hub" cx="150" cy="150" r="20" fill="#c0392b" stroke="#f4f1eb" stroke-width="3"/>
 <path id="marker" d="M150 8 L143 22 L157 22 Z" fill="#3c3a36"/>
</svg>

<div class="sizes">
 <span class="s onq" data-s="1"></span>
 <span class="s" data-s="1.25"></span>
 <span class="s" data-s="1.5"></span>
</div>

<div id="sel"><span id="fx">✕</span><span id="grip"></span></div>

<script>
 var NS='http://www.w3.org/2000/svg';
 var svg=document.getElementById('w');
 var pet=document.getElementById('pet');
 var hub=document.getElementById('hub');
 var cz=document.getElementById('cz');
 var marker=document.getElementById('marker');
 var selEl=document.getElementById('sel');
 var grip=document.getElementById('grip');
 var fx=document.getElementById('fx');
 var N=16, STEP=360/N, r0=32, r1=124, CX=150, CY=150;
 var cols=['#0d0c0b','#262019','#2c2f3a','#3a332a'];
 for(var i=0;i<12;i++)cols.push('hsl('+i*30+', 65%, 46%)');
 function P(r,a){a*=Math.PI/180;return (CX+r*Math.cos(a)).toFixed(2)+' '+(CY+r*Math.sin(a)).toFixed(2)}
 for(var i=0;i<N;i++){
   var a=i*30-90;
   var p=document.createElementNS(NS,'path');
   p.setAttribute('class','petal');
   p.setAttribute('d','M'+P(r1,a-STEP/2+.4)+' A'+r1+' '+r1+' 0 0 1 '+P(r1,a+STEP/2-.4)+
     ' L'+P(r0,a+STEP/2-.4)+' A'+r0+' '+r0+' 0 0 0 '+P(r0,a-STEP/2+.4)+' Z');
   p.setAttribute('fill',cols[i]);
   p.setAttribute('stroke','rgba(255,255,255,.30)');
   p.setAttribute('stroke-width','1');
   p.style.transform='rotate('+(i*30)+'deg) scale(1)';
   pet.appendChild(p);
 }

 var KEY='colourwheel.v1';
 var open=false, rot=0, drag=null, selected=false;
 var openScale=1, restScale=0.22;
 var R={x:innerWidth/2,y:innerHeight/2};
 var O={x:innerWidth/2,y:innerHeight/2};
 var fresh=true;
 try{var sv=JSON.parse(localStorage.getItem(KEY)||'null');
   if(sv&&sv.rx!==undefined){
     R={x:sv.rx,y:sv.ry}; O={x:sv.ox,y:sv.oy};
     openScale=sv.s||1; rot=sv.rot||0; open=!!sv.open; fresh=false;
   }
 }catch(e){}

 function fitO(x,y){
   var m=r1*openScale+14;
   return {x:Math.max(m,Math.min(innerWidth-m,x)),
           y:Math.max(m,Math.min(innerHeight-m,y))};
 }
 function clampR(x,y){
   return {x:Math.max(30,Math.min(innerWidth-30,x)),
           y:Math.max(30,Math.min(innerHeight-30,y))};
 }
 function cur(){return open?O:R}
 function pin(){try{localStorage.setItem(KEY,JSON.stringify(
   {rx:R.x,ry:R.y,ox:O.x,oy:O.y,s:openScale,rot:Math.round(rot),open:open}))}catch(e){}}
 function place(){
   var p=cur();
   svg.style.left=(p.x-CX)+'px'; svg.style.top=(p.y-CY)+'px';
   svg.style.transform='scale('+(open?openScale:restScale)+')';
 }
 function showSel(){
   var s=r1*openScale*2+20;
   selEl.style.width=s+'px'; selEl.style.height=s+'px';
   selEl.style.left=(cur().x-s/2)+'px'; selEl.style.top=(cur().y-s/2)+'px';
   selEl.classList.add('onq');
 }
 function hideSel(){selEl.classList.remove('onq')}
 function readOut(){
   var idx=((Math.round(-rot/STEP))%N+N)%N;
   hub.setAttribute('fill',cols[idx]);
 }
 function look(){
   svg.style.transition='left .5s ease, top .5s ease, transform .5s cubic-bezier(.34,1.45,.45,1)';
   place();
   marker.style.opacity=open? '.9':'0';
   readOut(); pin();
 }
 look(); if(fresh)pin();

 document.querySelectorAll('.s').forEach(function(b){
   b.addEventListener('click',function(){
     document.querySelectorAll('.s').forEach(function(x){x.classList.remove('onq')});
     b.classList.add('onq');
     openScale=parseFloat(b.dataset.s);
     O=fitO(O.x,O.y);
     svg.style.transition='left .35s ease, top .35s ease, transform .35s ease';
     place(); if(selected)showSel(); pin();
   });
 });
 (function(){var mark=null;
   document.querySelectorAll('.s').forEach(function(b){
     if(Math.abs(parseFloat(b.dataset.s)-openScale)<0.01)mark=b;});
   if(mark){document.querySelectorAll('.s').forEach(function(x){x.classList.remove('onq')});mark.classList.add('onq');}
 })();

 function angAt(x,y){
   var b=svg.getBoundingClientRect();
   return Math.atan2(y-(b.top+CY), x-(b.left+CX))*180/Math.PI;
 }
 svg.addEventListener('pointerdown',function(e){
   e.preventDefault();
   var t=e.target;
   var mode=(!open||selected||t===cz||t===hub)?'carry':'turn';
   drag={x:e.clientX,y:e.clientY,cx:cur().x,cy:cur().y,rot0:rot,t:t,moved:false,mode:mode};
   try{svg.setPointerCapture(e.pointerId)}catch(_){}
 });
 svg.addEventListener('pointermove',function(e){
   if(!drag)return;
   if(!drag.moved&&Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>8)drag.moved=true;
   if(!drag.moved)return;
   if(drag.mode==='turn'){
     var d=angAt(e.clientX,e.clientY)-angAt(drag.x,drag.y);
     rot=drag.rot0+d;
     pet.setAttribute('transform','rotate('+rot.toFixed(2)+' '+CX+' '+CY+')');
     readOut();
   } else {
     svg.style.transition='none';
     var nx=drag.cx+(e.clientX-drag.x), ny=drag.cy+(e.clientY-drag.y);
     if(open){O=fitO(nx,ny); place(); if(selected)showSel(); pin();}
     else {R=clampR(nx,ny); place(); pin();}
   }
 });
 function up(e){
   if(!drag)return;
   if(!drag.moved&&!open){
     open=true; O=fitO(R.x,R.y); look();
   } else if(!drag.moved&&open&&!selected){
     selected=true; showSel();
   } else if(!drag.moved&&open&&selected){
     selected=false; hideSel();
   } else if(drag.moved){ pin(); }
   drag=null;
 }
 svg.addEventListener('pointerup',up);
 svg.addEventListener('pointercancel',function(){drag=null});
 document.body.addEventListener('pointerup',function(e){
   if(!open||drag)return;
   if(e.target!==svg&&!svg.contains(e.target)){
     if(selected){selected=false; hideSel();}
     else{open=false; look();}
   }
 });

 var gdrag=false;
 grip.addEventListener('pointerdown',function(e){
   e.preventDefault(); e.stopPropagation();
   gdrag=true;
   try{grip.setPointerCapture(e.pointerId)}catch(_){}
 });
 grip.addEventListener('pointermove',function(e){
   if(!gdrag)return;
   var b=svg.getBoundingClientRect();
   var d=Math.hypot(e.clientX-(b.left+CX), e.clientY-(b.top+CY));
   openScale=Math.max(0.55,Math.min(1.7,d/r1));
   O=fitO(O.x,O.y);
   svg.style.transition='none';
   place(); showSel();
 });
 ['pointerup','pointercancel'].forEach(function(ev){
   grip.addEventListener(ev,function(){
     if(!gdrag)return;
     gdrag=false;
     svg.style.transition='';
     place();
     document.querySelectorAll('.s').forEach(function(x){x.classList.remove('onq')});
     pin();
   });
 });
 fx.addEventListener('click',function(e){
   e.stopPropagation();
   selected=false; hideSel(); open=false; look();
 });

 window.addEventListener('resize',function(){
   O=fitO(O.x,O.y);
   R=clampR(R.x,R.y);
   place(); if(selected)showSel(); pin();
 });
</script>
</body>
</html>

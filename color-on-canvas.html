<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Colour on Canvas</title>
<style>
 html,body{margin:0;height:100%;overflow:hidden;background:#8a8f96;
   font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none}
 .ab{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
   width:70vmin;height:70vmin;background:#f2f0ec;border-radius:4px;
   box-shadow:0 2px 12px rgba(0,0,0,.18)}
 .w{position:fixed;cursor:pointer;display:flex;align-items:center;
   justify-content:center;transition:transform .12s ease}
 .w:active{transform:scale(.94)}
 .gl{position:fixed;z-index:6;font-size:10px;color:rgba(38,41,46,.55);pointer-events:none}
 .pop{position:fixed;z-index:9;width:150px;height:150px;background:#fbf9f6;
   border:1px solid #c9c4bc;border-radius:14px;box-sizing:border-box;
   box-shadow:0 4px 18px rgba(0,0,0,.2);transform:scale(0);
   transition:transform .2s ease}
 .pop.onq{transform:scale(1)}
</style>
</head>
<body>

<div class="ab"></div>

<div class="w" id="A" style="left:16px;top:34%;width:52px;height:52px;
   border-radius:50%;background:#fbf9f6;border:1px solid #c9c4bc">
 <span style="width:18px;height:18px;border-radius:50%;background:#8a8f96"></span></div>

<div class="w" id="B" style="left:16px;bottom:18%;width:76px;height:76px;
   border-radius:50%;background:#fbf9f6;border:1px solid #c9c4bc;
   box-shadow:0 2px 8px rgba(0,0,0,.16)">
 <span style="width:34px;height:34px;border-radius:50%;background:#8a8f96;
   border:1px solid #bdb8b0"></span></div>

<div class="w" id="C" style="left:0;top:14%;width:30px;height:60px;
   border-radius:0 60px 60px 0;background:#fbf9f6;border:1px solid #c9c4bc;border-left:0">
 <span style="width:14px;height:14px;border-radius:50%;background:#8a8f96;margin-left:8px"></span></div>

<div class="w" id="D" style="left:16px;top:52%;width:auto;height:30px;
   background:#fbf9f6;border:1px solid #c9c4bc;border-radius:9px;padding:0 5px;
   box-sizing:border-box;gap:5px">
 <span style="width:16px;height:16px;border-radius:4px;background:#d6d2ca"></span>
 <span style="width:16px;height:16px;border-radius:4px;background:#bdb8b0"></span>
 <span style="width:16px;height:16px;border-radius:4px;background:#9a958d"></span>
 <span style="width:16px;height:16px;border-radius:4px;background:#6e6a63"></span></div>

<div class="w" id="E" style="left:36px;top:13%;width:110px;height:110px;border-radius:50%;
   background:conic-gradient(#c25650,#c9a03b,#7f9e4a,#4e93a6,#6b5f9e,#a5588f,#c25650);
   box-shadow:0 2px 8px rgba(0,0,0,.16)">
 <span style="width:40px;height:40px;border-radius:50%;background:#f2f0ec;
   border:1px solid #c9c4bc"></span></div>

<script>
 document.querySelectorAll('.w').forEach(function(t,i){
   var g=document.createElement('span'); g.className='gl';
   g.textContent=String.fromCharCode(65+i);
   document.body.appendChild(g);
   var glPlace=function(){var r=t.getBoundingClientRect();
     g.style.left=(r.right+6)+'px'; g.style.top=(r.top+r.height/2-6)+'px';};
   glPlace(); window.addEventListener('resize',glPlace);
   var p=document.createElement('div'); p.className='pop';
   var p=document.createElement('div'); p.className='pop';
   var r=t.getBoundingClientRect();
   var place=function(){
     var r=t.getBoundingClientRect();
     var x=r.left<innerWidth/2?r.right+14:r.left-164;
     var y=Math.min(Math.max(10,r.top-50),innerHeight-160);
     p.style.left=x+'px'; p.style.top=y+'px';
   };
   place();
   document.body.appendChild(p);
   t.addEventListener('click',function(){
     var on=p.classList.contains('onq');
     document.querySelectorAll('.pop.onq').forEach(function(o){o.classList.remove('onq')});
     if(!on)p.classList.add('onq');
   });
   window.addEventListener('resize',place);
 });
</script>
</body>
</html>

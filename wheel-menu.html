<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>The wheel menu</title>
<style>
 html,body{margin:0;background:#e9e6e0;font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:pan-y}
 .wrap{max-width:none;margin:0 auto;padding:18px 16px 60px}
 h1{font-size:26px;color:#3c3a36;font-weight:600;margin:0}
 p.sub,.card .desc{font-size:15px;color:#6d6a64;margin:6px 0 0;line-height:1.5}
 .card{background:#f4f1ea;border:1px solid #d8d3c8;border-radius:14px;padding:14px;margin-top:18px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
 .card h2{font-size:19px;color:#3c3a36;margin:0 0 4px}
 svg.xv{width:100%;height:auto;display:block;margin:0 auto;touch-action:pan-y}
 .cap{font-size:12px;color:#8a857c;text-align:center;margin:10px 0 0;line-height:1.5}
 .pick{font-size:15px;color:#3c3a36;text-align:center;margin:6px 0 0;min-height:18px;font-weight:600}
 .pick span{color:#8a857c;font-weight:400}
</style>
</head>
<body>
<div class="wrap">
 <h1>The wheel menu</h1>
 <p class="sub">Tap the wheel. Choose a colour. Its effects come out.</p>

 <div class="card"><h2>The door</h2>
  <svg class="xv" id="v1" viewBox="0 0 420 560"></svg>
  <div class="pick" id="p1"><span>tap the wheel to open its menu</span></div></div>
</div>

<script>
/* THE WHEEL MENU: the page the user lands on after tapping the packed wheel.
   THE CHAIN (owner's words): "to open the wheel would lead to the color menu
   which would go to color and effects of that color."
   DOOR LAW: the packed wheel on the paper is the door - one tap in, one tap out.
   UNPACKING LAW: unpacking happens HERE, never on the paper.
   WHOLE-DEVICE LAW: the menu is the whole screen - the container opened, not a chip.
   EFFECTS LAW: nothing is a flat chip - every colour disc is painted with a
   colour effect, every effect pill carries its own effect.
   Effects defs + pen() ported verbatim from jar-tower.html / layered-container.html. */
var COLS=[
 ['#c23b2e','pillar red'],
 ['#d9a428','brass yellow'],
 ['#2e7f8f','river teal'],
 ['#5d8a4a','leaf green'],
 ['#0d0c0b','ink black'],
 ['#7d3f6e','plum'],
 ['#35558a','deep blue'],
 ['#b0632e','burnt orange'],
 ['#6b7a3a','moss'],
 ['#4a4f57','slate'],
 ['#b34a6b','rose'],
 ['#d97f4a','apricot'],
 ['#5a8fc2','sky'],
 ['#cbb26a','sand'],
 ['#7a7a3d','olive'],
 ['#3f7f6f','sea'],
 ['#6a4f9f','violet'],
 ['#9a4a2a','rust'],
 ['#2f5a45','pine'],
 ['#5a4033','cocoa']
];
var TOOLN=['pencil','ink','watercolour','paint','marker','pastel','metallic','charcoal','spray','chalk'];
var TOOLF=['pk','ih','wc','pt','mb','pg','ms','ch','sp','ck'];
var TOOLC=[9,4,3,0,2,1,6,9,7,1];
function pen(ci,t){return 'url(#'+TOOLF[t]+'c'+ci+')';}
function fxDefsAll(){
 var s='<linearGradient id="ms" x1="0" y1="0" x2="1" y2="1">'+
    '<stop offset="0%" stop-color="#e6e7ea"/><stop offset="38%" stop-color="#14161a"/>'+
    '<stop offset="50%" stop-color="#dcdde1"/><stop offset="84%" stop-color="#2a2d33"/>'+
    '<stop offset="100%" stop-color="#c9cacd"/></linearGradient>';
 for(var i=0;i<COLS.length;i++){
  var c=COLS[i][0], f='c'+i;
  s+='<pattern id="pk'+f+'" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">'+
     '<rect width="10" height="10" fill="#f7f5ee"/>'+
     '<line x1="0" y1="2" x2="10" y2="2" stroke="'+c+'" stroke-width="2.4" stroke-dasharray="7 2" opacity=".5"/>'+
     '<line x1="0" y1="6.5" x2="10" y2="6.5" stroke="'+c+'" stroke-width="1.3" stroke-dasharray="4 3" opacity=".32"/></pattern>';
  s+='<pattern id="ih'+f+'" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">'+
     '<rect width="8" height="8" fill="#faf8f3"/>'+
     '<line x1="0" y1="4" x2="8" y2="3.4" stroke="'+c+'" stroke-width="1.1" opacity=".85"/></pattern>';
  s+='<filter id="wcf'+f+'" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6"/></filter>';
  s+='<pattern id="wc'+f+'" width="72" height="72" patternUnits="userSpaceOnUse">'+
     '<rect width="72" height="72" fill="#faf8f2"/>'+
     '<path d="M16,22 C 26,7 54,6 63,20 C 72,34 66,56 49,63 C 33,70 12,61 12,43 C 12,34 14,28 16,22 Z" fill="'+c+'" opacity=".38"/>'+
     '<g filter="url(#wcf'+f+')">'+
     '<path d="M13,25 C 23,11 51,10 60,23 C 67,34 63,53 47,59 C 32,65 15,56 14,40 Z" fill="'+c+'" opacity=".34"/>'+
     '</g>'+
     '<path d="M16,22 C 26,7 54,6 63,20" fill="none" stroke="'+c+'" stroke-width="1.2" opacity=".5"/></pattern>';
  s+='<pattern id="pt'+f+'" width="56" height="56" patternUnits="userSpaceOnUse">'+
     '<rect width="56" height="56" fill="#f9f7f1"/>'+
     '<path d="M4 22 Q 28 8 52 20 Q 54 34 30 40 Q 8 44 4 22 Z" fill="'+c+'" opacity=".92"/>'+
     '<path d="M6 34 Q 26 42 48 32 Q 50 40 30 46 Q 10 48 6 34 Z" fill="'+c+'" opacity=".85"/>'+
     '<path d="M4 22 Q 28 8 52 20" fill="none" stroke="#ffffff" stroke-width="1.4" opacity=".45"/></pattern>';
  s+='<filter id="mbf'+f+'" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.4"/></filter>';
  s+='<pattern id="mb'+f+'" width="56" height="56" patternUnits="userSpaceOnUse">'+
     '<rect width="56" height="56" fill="#f7f5f0"/>'+
     '<g filter="url(#mbf'+f+')">'+
     '<path d="M6 16 Q 30 6 54 18" stroke="'+c+'" stroke-width="9" fill="none" stroke-linecap="round" opacity=".55"/>'+
     '<path d="M4 36 Q 30 46 56 32" stroke="'+c+'" stroke-width="9" fill="none" stroke-linecap="round" opacity=".55"/>'+
     '<path d="M8 54 Q 32 58 54 48" stroke="'+c+'" stroke-width="9" fill="none" stroke-linecap="round" opacity=".55"/>'+
     '</g></pattern>';
  s+='<filter id="pgf'+f+'"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>';
  s+='<pattern id="pg'+f+'" width="56" height="56" patternUnits="userSpaceOnUse">'+
     '<rect width="56" height="56" fill="'+c+'" opacity=".34"/>'+
     '<rect width="56" height="56" filter="url(#pgf'+f+')" opacity=".35"/>'+
     '<rect width="56" height="56" fill="'+c+'" opacity=".18"/></pattern>';
  s+='<linearGradient id="ms'+f+'" x1="0" y1="0" x2="1" y2="1">'+
     '<stop offset="0%" stop-color="#e6e7ea"/><stop offset="20%" stop-color="'+c+'"/>'+
     '<stop offset="38%" stop-color="#14161a"/><stop offset="50%" stop-color="#dcdde1"/>'+
     '<stop offset="64%" stop-color="'+c+'"/><stop offset="84%" stop-color="#2a2d33"/>'+
     '<stop offset="100%" stop-color="#c9cacd"/></linearGradient>';
  s+='<filter id="chf'+f+'" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>';
  s+='<pattern id="ch'+f+'" width="56" height="56" patternUnits="userSpaceOnUse">'+
     '<rect width="56" height="56" fill="#f3f2ee"/>'+
     '<g filter="url(#chf'+f+')">'+
     '<path d="M8 18 Q 28 8 48 20 Q 50 36 28 40 Q 6 38 8 18 Z" fill="'+c+'" opacity=".8"/>'+
     '<path d="M10 44 Q 30 38 48 46" stroke="'+c+'" stroke-width="6" fill="none" stroke-linecap="round" opacity=".6"/>'+
     '</g>'+
     '<rect width="56" height="56" filter="url(#pgf'+f+')" opacity=".22"/></pattern>';
  s+='<pattern id="sp'+f+'" width="56" height="56" patternUnits="userSpaceOnUse">'+
     '<rect width="56" height="56" fill="#f7f6f1"/>'+
     '<circle cx="14" cy="14" r="3" fill="'+c+'" opacity=".8"/>'+
     '<circle cx="38" cy="10" r="2" fill="'+c+'" opacity=".7"/>'+
     '<circle cx="30" cy="30" r="4" fill="'+c+'" opacity=".8"/>'+
     '<circle cx="10" cy="40" r="2.5" fill="'+c+'" opacity=".7"/>'+
     '<circle cx="46" cy="44" r="3" fill="'+c+'" opacity=".8"/>'+
     '<circle cx="22" cy="50" r="1.6" fill="'+c+'" opacity=".6"/>'+
     '<circle cx="50" cy="26" r="1.2" fill="'+c+'" opacity=".5"/>'+
     '<circle cx="6" cy="26" r="1" fill="'+c+'" opacity=".5"/></pattern>';
  s+='<pattern id="ck'+f+'" width="56" height="56" patternUnits="userSpaceOnUse">'+
     '<rect width="56" height="56" fill="#f8f7f2"/>'+
     '<line x1="4" y1="20" x2="52" y2="16" stroke="'+c+'" stroke-width="7" stroke-dasharray="12 5 8 7" stroke-linecap="round" opacity=".75"/>'+
     '<line x1="6" y1="40" x2="50" y2="44" stroke="'+c+'" stroke-width="6" stroke-dasharray="9 6 5 8" stroke-linecap="round" opacity=".6"/></pattern>';
 }
 return s;
}
(function(){
 var d=document.createElementNS('http://www.w3.org/2000/svg','svg');
 d.setAttribute('width','0'); d.setAttribute('height','0'); d.setAttribute('style','position:absolute');
 d.innerHTML='<defs>'+fxDefsAll()+'</defs>';
 document.body.insertBefore(d,document.body.firstChild);
})();

function tag(name,edge,sw){return ' data-name="'+name+'" data-stroke="'+edge+'" data-sw="'+sw+'"'}
function E(x){return x.toFixed(1)}

/* annular wedge path, centred on 0,0 (ported geometry, angles in degrees) */
function wedge(r0,r1,a0,a1){
 var rad=function(a){return a*Math.PI/180};
 var x0=E(r1*Math.cos(rad(a0))), y0=E(r1*Math.sin(rad(a0)));
 var x1=E(r1*Math.cos(rad(a1))), y1=E(r1*Math.sin(rad(a1)));
 var x2=E(r0*Math.cos(rad(a1))), y2=E(r0*Math.sin(rad(a1)));
 var x3=E(r0*Math.cos(rad(a0))), y3=E(r0*Math.sin(rad(a0)));
 return 'M'+x0+' '+y0+' A'+r1+' '+r1+' 0 0 1 '+x1+' '+y1+' L'+x2+' '+y2+' A'+r0+' '+r0+' 0 0 0 '+x3+' '+y3+' Z';
}

/* THE PACKED WHEEL: ten effect wedges, the door */
function wheelSvg(pref){
 var s='<g id="'+pref+'wheel">';
 for(var t=0;t<10;t++){
  s+='<path d="'+wedge(16,50,t*36-90,t*36-54)+'" fill="'+pen(TOOLC[t],t)+'" stroke="#f5f3ec" stroke-width="1.2" data-wheel="1"'+tag(TOOLN[t]+' \u00b7 '+COLS[TOOLC[t]][1],'#f5f3ec','1.2')+'/>';
 }
 s+='<circle cx="0" cy="0" r="52" fill="none" stroke="#14171a" stroke-width="1" pointer-events="none"/>';
 s+='<circle cx="0" cy="0" r="7" fill="#f1ede2" stroke="#14171a" stroke-width=".8" pointer-events="none"/>';
 s+='</g>';
 return s;
}

/* THE MENU ROOM */
function menuSvg(pref){
 var s='<g id="'+pref+'menu" opacity="0" pointer-events="none">';
 /* the whole screen painted - the container's interior (whole-device law) */
 s+='<rect x="0" y="0" width="420" height="560" fill="#f7f4ed" pointer-events="none"/>';
 s+='<path d="M300,40 C 380,30 416,90 408,150 C 400,208 340,236 296,208 C 252,180 240,110 268,72 C 278,58 288,44 300,40 Z" fill="'+pen(12,2)+'" opacity=".4" pointer-events="none"/>';
 s+='<path d="M60,470 C 20,430 30,380 70,368 C 112,356 150,392 144,436 C 138,478 96,502 60,470 Z" fill="'+pen(13,2)+'" opacity=".35" pointer-events="none"/>';
 s+='<rect x="10" y="10" width="400" height="540" rx="16" fill="none" stroke="#d8d3c8" stroke-width="1" pointer-events="none"/>';
 /* the way out - a real, visible control */
 s+='<rect id="'+pref+'back" x="24" y="20" width="132" height="32" rx="16" fill="#fffdf8" stroke="#14171a" stroke-width="1" data-act="back"'+tag('back to the paper','#14171a','1')+'/>';
 s+='<text x="90" y="41" text-anchor="middle" font-size="12.5" font-family="system-ui,sans-serif" fill="#3c3a36" pointer-events="none">back to the paper</text>';
 /* the wheel stands at the front as the face - not tappable as a door from inside */
 /* the colour menu: twenty colours, each painted with a colour effect, never a flat chip */
 for(var i=0;i<20;i++){
  var cx=58+(i%5)*76, cy=140+Math.floor(i/5)*78;
  s+='<circle id="'+pref+'d'+i+'" cx="'+cx+'" cy="'+cy+'" r="20" fill="'+pen(i,3)+'" stroke="#14171a" stroke-width=".8" data-i="'+i+'"'+tag(COLS[i][1],'#14171a','.8')+'/>';
 }
 s+='<circle id="'+pref+'ring" cx="0" cy="0" r="25" fill="none" stroke="#14171a" stroke-width="2" opacity="0" pointer-events="none"/>';
 s+='<text id="'+pref+'efh" x="210" y="432" text-anchor="middle" font-size="12" font-family="system-ui,sans-serif" fill="#6d6a64" pointer-events="none"></text>';
 /* the effects of the chosen colour: ten pills, each carrying its own effect */
 for(var t=0;t<10;t++){
  var px=30+(t%5)*74, py=440+Math.floor(t/5)*52;
  s+='<g id="'+pref+'ef'+t+'" opacity="0">';
  s+='<rect id="'+pref+'efr'+t+'" x="'+px+'" y="'+py+'" width="66" height="26" rx="13" fill="'+pen(0,t)+'" stroke="#14171a" stroke-width=".5" data-t="'+t+'"'+tag(TOOLN[t],'#14171a','.5')+'/>';
  s+='<text x="'+(px+33)+'" y="'+(py+40)+'" text-anchor="middle" font-size="10" font-family="system-ui,sans-serif" fill="#3c3a36" pointer-events="none">'+TOOLN[t]+'</text>';
  s+='</g>';
 }
 s+='</g>';
 return s;
}

(function(){
 var svg=document.getElementById('v1');
 var lab=document.getElementById('p1');
 svg.innerHTML='<g id="mpaper">'+
  '<rect x="16" y="16" width="388" height="528" rx="14" fill="#fbfaf5" stroke="#d8d3c8" stroke-width="1.5"'+tag('the drawing paper','#d8d3c8','1.5')+'/>'+
  '</g>'+wheelSvg('m')+menuSvg('m');
 var g=function(id){return document.getElementById(id)};
 var wheel=g('mwheel'), paper=g('mpaper'), menu=g('mmenu'), ring=g('mring'), efh=g('mefh');
 var discs=[], efs=[];
 for(var i=0;i<20;i++)discs.push(g('md'+i));
 for(var t=0;t<10;t++)efs.push(g('mef'+t));

 var st='paper', chosen=-1;
 var wp={x:210,y:260,s:1}, pop={v:1}, mop={v:0}, wop={v:1};
 var rp={x:210,y:260,o:0};
 var ep=[];
 for(var t=0;t<10;t++)ep.push({o:0,dy:14});
 function frame(){
  var on=st==='menu';
  wp.x+=(210-wp.x)*0.14; wp.y+=((on?110:260)-wp.y)*0.14; wp.s+=((on?1.08:1)-wp.s)*0.14;
  wheel.setAttribute('transform','translate('+E(wp.x)+','+E(wp.y)+') scale('+wp.s.toFixed(3)+')');
  wop.v+=((on?0:1)-wop.v)*0.14;
  wheel.setAttribute('opacity',E(wop.v));
  wheel.setAttribute('pointer-events',wop.v>0.5?'auto':'none');
  pop.v+=((on?0:1)-pop.v)*0.14;
  paper.setAttribute('opacity',E(pop.v));
  paper.setAttribute('pointer-events',pop.v>0.5?'auto':'none');
  mop.v+=((on?1:0)-mop.v)*0.14;
  menu.setAttribute('opacity',E(mop.v));
  menu.setAttribute('pointer-events',mop.v>0.5?'auto':'none');
  if(chosen>=0){ rp.x+=(+discs[chosen].getAttribute('cx')-rp.x)*0.2; rp.y+=(+discs[chosen].getAttribute('cy')-rp.y)*0.2; }
  rp.o+=(((chosen>=0&&on)?1:0)-rp.o)*0.14;
  ring.setAttribute('cx',E(rp.x)); ring.setAttribute('cy',E(rp.y));
  ring.setAttribute('opacity',E(rp.o));
  for(var t=0;t<10;t++){
   ep[t].o+=(((chosen>=0&&on)?1:0)-ep[t].o)*0.14;
   ep[t].dy+=(((chosen>=0&&on)?0:14)-ep[t].dy)*0.14;
   efs[t].setAttribute('opacity',E(ep[t].o));
   efs[t].setAttribute('transform','translate(0,'+E(ep[t].dy)+')');
  }
  requestAnimationFrame(frame);
 }
 frame();

 function choose(i){
  chosen=i;
  for(var t=0;t<10;t++){
   g('mefr'+t).setAttribute('fill',pen(i,t));
  }
  efh.textContent=COLS[i][1]+' \u00b7 its ten effects';
  lab.textContent=COLS[i][1]+' \u00b7 its effects are out below, in reach';
 }
 svg.addEventListener('pointerdown',function(e){
  try{svg.setPointerCapture(e.pointerId)}catch(_){}
 });
 svg.addEventListener('pointerup',function(e){
  var el=document.elementFromPoint(e.clientX,e.clientY);
  var col=el?el.closest('[data-name]'):null;
  if(!col)return;
  if(col.dataset.act==='back'){
   st='paper'; chosen=-1;
   efh.textContent='';
   lab.innerHTML='<span>tap the wheel to open its menu</span>';
   return;
  }
  if(col.dataset.i!==undefined&&st==='menu'){ choose(+col.dataset.i); return; }
  if(col.dataset.t!==undefined&&chosen>=0){
   lab.textContent=TOOLN[+col.dataset.t]+' of '+COLS[chosen][1];
   return;
  }
  if(col.dataset.wheel==='1'){
   if(st==='paper'){ st='menu'; lab.textContent='the colour menu \u00b7 choose a colour'; }
   else lab.textContent=col.dataset.name;
   return;
  }
  lab.textContent=col.dataset.name;
 });
})();
</script>
</body>
</html>

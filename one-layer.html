<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>One layer - the pencil layer</title>
<style>
 html,body{margin:0;background:#e9e6e0;font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:pan-y}
 .wrap{max-width:none;margin:0 auto;padding:18px 16px 60px}
 h1{font-size:26px;color:#3c3a36;font-weight:600;margin:0}
 p.sub{font-size:15px;color:#6d6a64;margin:6px 0 0}
 svg.xv{width:100%;height:auto;display:block;margin:14px auto 0;touch-action:pan-y}
 .pick{font-size:15px;color:#3c3a36;text-align:center;margin:6px 0 0;min-height:18px;font-weight:600}
 .pick span{color:#8a857c;font-weight:400}
</style>
</head>
<body>
<div class="wrap">
 <h1>One layer</h1>
 <p class="sub">The pencil layer &mdash; the pencil effect on every colour.</p>

 <svg class="xv" id="v1" viewBox="0 0 420 560"></svg>
 <div class="pick" id="p1"><span></span></div>
</div>

<script>
/* ONE LAYER (owner: "lets look at one layer, whats on one layer. i guess pencils
   of all kinds would be here, the pencil effect on a colour, as we are not in the
   color menu here"). LAYER LAW: one layer = ONE EFFECT worn by EVERY colour.
   This page shows just that: the pencil layer, 20 colour-effects, drawn as a
   tray pulled out of the container; the edges of the layers beneath peek below.
   No colour menu here - colour arrives through the effect. Effects defs and
   pen() ported verbatim from wheel-menu.html / jar-tower.html. */
var COLS=[
 ['#c23b2e','pillar red'],
 ['#d9a428','brass yellow'],
 ['#2e7f8f','river teal'],
 ['#5d8a4a','leaf green'],
 ['#0d0c0b','ink black'],
 ['#7d3f6e','plum'],
 ['#35558a','deep blue'],
 ['#b0632e','burnt orange'],
 ['#6b7a3a','moss'],
 ['#4a4f57','slate'],
 ['#b34a6b','rose'],
 ['#d97f4a','apricot'],
 ['#5a8fc2','sky'],
 ['#cbb26a','sand'],
 ['#7a7a3d','olive'],
 ['#3f7f6f','sea'],
 ['#6a4f9f','violet'],
 ['#9a4a2a','rust'],
 ['#2f5a45','pine'],
 ['#5a4033','cocoa']
];
var TOOLN=['pencil','ink','watercolour','paint','marker','pastel','metallic','charcoal','spray','chalk'];
var TOOLF=['pk','ih','wc','pt','mb','pg','ms','ch','sp','ck'];
function pen(ci,t){return 'url(#'+TOOLF[t]+'c'+ci+')';}
function fxDefsAll(){
 var s='';
 for(var i=0;i<COLS.length;i++){
  var c=COLS[i][0], f='c'+i;
  s+='<pattern id="pk'+f+'" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">'+
     '<rect width="10" height="10" fill="#f7f5ee"/>'+
     '<line x1="0" y1="2" x2="10" y2="2" stroke="'+c+'" stroke-width="2.4" stroke-dasharray="7 2" opacity=".5"/>'+
     '<line x1="0" y1="6.5" x2="10" y2="6.5" stroke="'+c+'" stroke-width="1.3" stroke-dasharray="4 3" opacity=".32"/></pattern>';
 }
 return s;
}
(function(){
 var d=document.createElementNS('http://www.w3.org/2000/svg','svg');
 d.setAttribute('width','0'); d.setAttribute('height','0'); d.setAttribute('style','position:absolute');
 d.innerHTML='<defs>'+fxDefsAll()+'</defs>';
 document.body.insertBefore(d,document.body.firstChild);
})();

function tag(name,edge,sw){return ' data-name="'+name+'" data-stroke="'+edge+'" data-sw="'+sw+'"'}
function E(x){return x.toFixed(1)}

(function(){
 var svg=document.getElementById('v1');
 var lab=document.getElementById('p1');
 var s='';
 /* the layer in digital space: no tray, no cabinet, no furniture -
   just the pencil effect on every colour, arranged in open space */
 for(var i=0;i<20;i++){
  var x=16+(i%4)*100, y=80+Math.floor(i/4)*92;
  s+='<rect id="sw'+i+'" x="'+x+'" y="'+y+'" width="92" height="64" rx="10" fill="'+pen(i,0)+'" stroke="#14171a" stroke-width=".8"'+tag('pencil of '+COLS[i][1],'#14171a','.8')+'/>';
  s+='<text x="'+(x+46)+'" y="'+(y+80)+'" text-anchor="middle" font-size="10" font-family="system-ui,sans-serif" fill="#6d6a64" pointer-events="none">'+COLS[i][1]+'</text>';
 }
 svg.innerHTML=s;
 var moved=false, px=0, py=0;
 svg.addEventListener('pointerdown',function(e){ px=e.clientX; py=e.clientY; moved=false; try{svg.setPointerCapture(e.pointerId)}catch(_){} });
 svg.addEventListener('pointermove',function(e){ if(Math.abs(e.clientX-px)+Math.abs(e.clientY-py)>8)moved=true; });
 svg.addEventListener('pointerup',function(e){
  if(moved)return;
  var el=document.elementFromPoint(e.clientX,e.clientY);
  var col=el?el.closest('[data-name]'):null;
  if(col)lab.textContent=col.dataset.name;
 });
})();
</script>
</body>
</html>

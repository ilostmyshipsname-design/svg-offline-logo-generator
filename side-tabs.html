<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Side Tabs</title>
<style>
 html,body{margin:0;height:100%;overflow:hidden;background:#8a8f96;
   font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none}
 .tab{position:fixed;z-index:5;cursor:pointer;display:flex;align-items:center;
   justify-content:center;background:#fbf9f6;color:#8a8f96;
   border:1px solid #c9c4bc;box-sizing:border-box;
   box-shadow:0 1px 5px rgba(0,0,0,.14);transition:box-shadow .15s ease}
 .tab:active{box-shadow:0 1px 9px rgba(0,0,0,.24)}
 .drawer{position:fixed;top:0;bottom:0;width:0;background:#fbf9f6;z-index:4;
   transition:width .25s ease;box-shadow:0 3px 14px rgba(0,0,0,.15)}
 .drawer.onq{width:230px}
 .r~.drawer{right:0}
 .arw{font-size:15px;transition:transform .25s ease}
 .openq .arw{transform:rotate(180deg)}
 .dots{width:3px;height:64px;background-image:radial-gradient(circle,#8a8f96 1.2px,transparent 1.5px);
   background-size:3px 9px}
 .gl{position:fixed;z-index:6;font-size:10px;color:rgba(38,41,46,.45);
   pointer-events:none;letter-spacing:1px}
</style>
</head>
<body>


<div class="tab" data-letter="A" style="right:0;top:5%;width:34px;height:90px;border-radius:10px 0 0 10px"></div>
<div class="tab" data-letter="B" style="right:0;top:17%;width:34px;height:90px;border-radius:10px 0 0 10px">
 <span class="arw">‹</span></div>
<div class="tab" data-letter="C" style="right:10px;top:31%;width:26px;height:64px;border-radius:14px"></div>
<div class="tab" data-letter="D" style="right:0;top:44%;width:30px;height:64px;border-radius:64px 0 0 64px"></div>
<div class="tab" data-letter="F" style="right:0;top:58%;width:40px;height:80px;border-radius:10px 0 0 10px">
 <span style="font-size:18px">≡</span></div>
<div class="tab" data-letter="G" style="right:0;top:73%;width:14px;height:90px;
   border-radius:8px 0 0 8px;border-right:0"></div>

<div class="tab" data-letter="H" data-side="l" style="left:0;top:5%;width:34px;height:90px;border-radius:0 10px 10px 0"></div>
<div class="tab" data-letter="E" data-side="l" style="left:0;top:22%;bottom:8%;width:30px;border-radius:0 10px 10px 0">
 <div class="dots"></div></div>

<script>
 var drawers={};
 document.querySelectorAll('.tab').forEach(function(t){
   var L=t.dataset.letter, side=t.dataset.side==='l'?'left':'right';
   t.dataset.side=side;
   var d=document.createElement('div');
   d.className='drawer'; d.style[side]='0';
   document.body.appendChild(d);
   t.addEventListener('click',function(){
     var was=d.classList.contains('onq');
     document.querySelectorAll('.drawer.onq').forEach(function(x){x.classList.remove('onq')});
     if(!was)d.classList.add('onq');
   });
 });
 document.querySelectorAll('.tab').forEach(function(t){
   var g=document.createElement('span');
   g.className='gl'; g.textContent=t.dataset.letter;
   var r=t.getBoundingClientRect();
   if(t.dataset.side==='left') g.style.left=(r.width+6)+'px';
   else g.style.right='0';
   g.style.transform='translateX(-38px)';
   if(t.dataset.side==='left') g.style.transform='none';
   document.body.appendChild(g);
   var place=function(){
     var r=t.getBoundingClientRect();
     g.style.top=(r.top+r.height/2-7)+'px';
     if(t.dataset.side==='left'){g.style.left=(r.right+6)+'px';g.style.right='auto';g.style.transform='none';}
     else {g.style.right=(r.width+8)+'px';g.style.left='auto';g.style.transform='none';}
   };
   place();
   window.addEventListener('resize',place);
 });
</script>
</body>
</html>

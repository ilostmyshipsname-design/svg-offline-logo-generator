<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Side Tabs</title>
<style>
 html,body{margin:0;min-height:100vh;background:#f2f0ec;color:#26292e;
   font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none;
   padding:20px 0 60px}
 .lb{font-size:12px;letter-spacing:1px;color:#8a8f96;margin:0 16px 6px}
 .gap{height:10px}
 .ex{position:relative;height:110px;margin:0 16px 24px;background:#8a8f96;
   border-radius:12px;overflow:hidden}
 .tab{position:absolute;z-index:5;cursor:pointer;display:flex;
   align-items:center;justify-content:center;background:#fbf9f6;color:#8a8f96;
   border:1px solid #c9c4bc;box-sizing:border-box;
   box-shadow:0 1px 4px rgba(0,0,0,.12);transition:box-shadow .15s ease}
 .tab:active{box-shadow:0 1px 7px rgba(0,0,0,.22)}
 .drawer{position:absolute;top:0;right:0;bottom:0;width:0;background:#fbf9f6;
   transition:width .25s ease;box-shadow:-3px 3px 10px rgba(0,0,0,.15)}
 .ex.openq .drawer{width:120px}
 .dots{width:3px;height:30px;background-image:radial-gradient(circle,#8a8f96 1.2px,transparent 1.5px);
   background-size:3px 7px}
 .arw{font-size:12px;transition:transform .25s ease}
 .ex.openq .arw{transform:rotate(180deg)}
</style>
</head>
<body>

<div class="lb">A</div>
<div class="ex" id="A"><div class="drawer"></div>
 <div class="tab" style="right:0;top:23px;width:28px;height:64px;border-radius:8px 0 0 8px"></div></div>

<div class="lb">B</div>
<div class="ex" id="B"><div class="drawer"></div>
 <div class="tab" style="right:0;top:23px;width:28px;height:64px;border-radius:8px 0 0 8px">
   <span class="arw">‹</span></div></div>

<div class="lb">C</div>
<div class="ex" id="C"><div class="drawer"></div>
 <div class="tab" style="right:10px;top:32px;width:20px;height:46px;border-radius:12px"></div></div>

<div class="lb">D</div>
<div class="ex" id="D"><div class="drawer"></div>
 <div class="tab" style="right:0;top:33px;width:22px;height:44px;border-radius:44px 0 0 44px"></div></div>

<div class="lb">E</div>
<div class="ex" id="E"><div class="drawer"></div>
 <div class="tab" style="right:0;top:8px;bottom:8px;width:22px;border-radius:8px 0 0 8px">
   <div class="dots"></div></div></div>

<div class="lb">F</div>
<div class="ex" id="F"><div class="drawer"></div>
 <div class="tab" style="right:0;top:27px;width:30px;height:56px;border-radius:8px 0 0 8px">
   <span style="font-size:16px">≡</span></div></div>

<div class="lb">G</div>
<div class="ex" id="G"><div class="drawer"></div>
 <div class="tab" style="right:0;top:23px;width:10px;height:64px;
   border-radius:6px 0 0 6px;border-left:0"></div></div>

<div class="gap"></div>
<div class="lb">H</div>
<div class="ex" id="H"><div class="drawer"></div>
 <div class="tab" style="left:0;top:23px;width:28px;height:64px;border-radius:0 8px 8px 0"></div></div>

<script>
 document.querySelectorAll('.ex .tab').forEach(function(t){
   t.addEventListener('click',function(){
     var ex=t.parentElement, was=ex.classList.contains('openq');
     document.querySelectorAll('.ex.openq').forEach(function(x){x.classList.remove('openq')});
     if(!was)ex.classList.add('openq');
   });
 });
</script>
</body>
</html>

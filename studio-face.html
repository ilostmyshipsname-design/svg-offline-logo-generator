<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Studio – the space</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #8a8f96; font-family: system-ui, sans-serif; user-select: none;
    -webkit-user-select: none; }
  #space { position: absolute; background: #f2f0ec; border: 2px solid #3a3f46;
    box-shadow: 0 4px 18px rgba(0,0,0,.35); border-radius: 4px; }
</style>
</head>
<body>

<div id="space"></div>

<script>
(function () {
  'use strict';
  function fit() {
    var s = document.getElementById('space');
    var m = 24;
    var w = document.documentElement.clientWidth - m * 2;
    var h = document.documentElement.clientHeight - m * 2;
    var side = Math.min(w, h);
    s.style.width = side + 'px';
    s.style.height = side + 'px';
    s.style.left = ((document.documentElement.clientWidth - side) / 2) + 'px';
    s.style.top = ((document.documentElement.clientHeight - side) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SVG Logo Generator – Stage 1</title>
<style>
:root{--bg:#f4f3ef;--panel:#fff;--ink:#1d1d1f;--line:#d6d4cc;--acc:#2f6bff;--grid:#e6e4dc;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1c1f;--panel:#26282c;--ink:#f0f0f0;--line:#3a3d43;--acc:#6b9bff;--grid:#2a2c31}}
:root[data-theme="dark"]{--bg:#1b1c1f;--panel:#26282c;--ink:#f0f0f0;--line:#3a3d43;--acc:#6b9bff;--grid:#2a2c31}
html,body{position:fixed;inset:0;width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#bar{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;flex:none;z-index:2}
#bar button,#bar label{min-width:46px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;flex:none}
#bar button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#bar input[type=color]{width:30px;height:30px;border:0;padding:0;background:none}
#bar input[type=range]{width:95px}
#stage{flex:1;position:relative;width:100%;min-height:0;overflow:hidden;touch-action:none}
svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#status{position:absolute;left:12px;bottom:8px;right:12px;font-size:12px;opacity:.7;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bot{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto;flex:none;z-index:2}
#bot button,#bot label{min-width:46px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;flex:none}
#grpBtn{display:none;background:var(--acc)!important;color:#fff!important;border-color:var(--acc)!important;font-weight:600}
#sidePanel{display:none;gap:6px;align-items:center;margin-left:4px}
#axisPanel{display:none;gap:8px;align-items:center;margin-left:auto}
#axisPanel input{width:min(34vw,180px)}
#shell{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;z-index:3}
#shellBtn{height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font-size:15px;font-weight:600}
#shellProj{margin-left:auto;font-size:13px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
#sec-vector{flex:1;display:flex;flex-direction:column;min-height:0}
#sec-page{flex:1;display:none;overflow:auto;padding:18px;user-select:text;-webkit-user-select:text;touch-action:pan-y}
#sec-page h2{margin:0 0 6px;font-size:22px}
#sec-page .sub{margin:0 0 14px;opacity:.7}
#sec-page .note{margin-top:16px;padding:12px 14px;border:1px dashed var(--line);border-radius:12px;opacity:.8}
#sec-page li{margin:4px 0}
#sec-page .pn{display:block;margin-bottom:8px}
#sec-page .pn input{display:block;width:100%;max-width:420px;box-sizing:border-box;height:44px;margin-top:6px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font-size:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{text-align:left;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);display:flex;flex-direction:column;gap:4px;font-size:14px;min-height:92px}
.card b{font-size:16px}.card span{opacity:.7}.card i{font-style:normal;font-size:12px;color:var(--acc);margin-top:auto}
#menu{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50}
#menuPanel{position:absolute;left:8px;top:calc(env(safe-area-inset-top,0px) + 58px);width:min(92vw,360px);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.mi{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:56px;padding:8px 12px;border:0;border-radius:10px;background:transparent;color:var(--ink);text-align:left;font-size:15px}
.mi span{font-size:12px;opacity:.65}.mi:active{background:var(--bg)}
#nav{display:flex;gap:4px;align-items:stretch;justify-content:space-around;padding:5px 6px calc(env(safe-area-inset-bottom,0px) + 5px);background:var(--panel);border-top:1px solid var(--line);flex:none;z-index:4}
#nav button{flex:1;min-width:44px;height:48px;border:0;background:transparent;color:var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;padding:0;opacity:.6}
#nav button.on{background:var(--acc);color:#fff;opacity:1}
#nav button:active{opacity:1}
</style>
</head>
<body>
<div id="shell"><button id="shellBtn" aria-label="Sections">☰ <span id="shellTitle"></span></button><span id="shellProj"></span></div>
<div id="sec-vector">
<div id="bar">
  <button id="tPencil" class="on">✏️ Pencil</button>
  <label>Colour <input type="color" id="col" value="#1d4ed8"></label>
  <label>Width <input type="range" id="wid" min="2" max="40" value="8"></label>
  <button id="clr">Clear</button>
</div>
<div id="stage">
  <svg id="svg">
    <defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="var(--grid)" stroke-width="1" vector-effect="non-scaling-stroke"/></pattern></defs>
    <g id="world">
      <rect width="1000" height="1000" fill="var(--panel)"/>
      <rect width="1000" height="1000" fill="url(#g)"/>
      <path d="M500 0V1000M0 500H1000" stroke="var(--acc)" stroke-opacity=".28" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <rect x="50" y="50" width="900" height="900" fill="none" stroke="var(--acc)" stroke-opacity=".6" stroke-width="1.3" stroke-dasharray="8 6" vector-effect="non-scaling-stroke"/>
      <rect width="1000" height="1000" fill="none" stroke="var(--ink)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    </g>
    <g id="shapes"></g><path id="mask" fill-rule="evenodd" fill="var(--bg)" fill-opacity=".62" pointer-events="none"/><g id="draft"></g><g id="over"></g>
  </svg>
  <div id="status"></div>
</div>
<div id="bot">
  <button id="undo" aria-label="Undo" style="font-size:22px;min-width:50px">↶</button>
  <button id="redo" aria-label="Redo" style="font-size:22px;min-width:50px">↷</button>
  <button id="grpBtn">⬚ Whole Group</button>
  <div id="sidePanel"><button id="sMinus">−</button><input id="sVal" inputmode="numeric" enterkeyhint="done" autocomplete="off" aria-label="Number of sides" style="width:68px;height:44px;text-align:center;font-size:17px;font-weight:600;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink)"><button id="sPlus">+</button></div>
  <div id="axisPanel"><label>Flip axis <input type="range" id="fax" min="0" max="359" value="90"><span id="favl">90°</span></label><button id="axX">✕</button></div>
</div>
</div>
<div id="sec-page"></div>
<div id="menu"><div id="menuPanel"></div></div>
<div id="nav"></div>
<script>
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('svg');
const $=id=>document.getElementById(id);
let shapes=[],sel=null,subSel=null,tool='pencil',nid=1,drag=null;
const MIN=10,ROT_OFF=34;
const get=id=>shapes.find(s=>s.id===id);

function activeTarget(){
  const s=get(sel);
  if(!s)return null;
  if(s.parts&&subSel!==null&&s.parts[subSel])return s.parts[subSel];
  return s;
}

function isCounterTarget(t){
  if(!t)return false;
  if(t.kind==='circle'||(t.kind==='poly'&&t.closed))return true;
  if(t.kind==='open'||t.kind==='line')return true;
  return false;
}

function getCounterLabel(t){
  if(!t)return '○';
  if(t.kind==='circle'||(t.kind==='poly'&&t.closed)){
    return (t.sides?String(t.sides):'○')+(t.orig?' ✎':'');
  }
  const segs=Math.max(1,(t.pts?t.pts.length-1:1));
  return segs+'∠';
}

function status(){
  const s=get(sel),t=activeTarget();
  let defaultMsg='Draw anywhere · tap a shape to select or edit';
  if(s&&s.id===openId)defaultMsg='Keep drawing anywhere to add to group · tap empty space when done';
  else if(s&&s.parts&&subSel!==null)defaultMsg='Editing stroke '+(subSel+1)+' of '+s.parts.length+' (stays in group)';
  else if(s&&s.parts)defaultMsg='Group ('+s.parts.length+' strokes) · tap any stroke inside to edit it';
  const out=s&&[[-1,-1],[1,-1],[1,1],[-1,1]].some(([a,b])=>{const q=l2w(s,a*s.w/2,b*s.h/2);return q[0]<0||q[1]<0||q[0]>AB||q[1]>AB});
  $('status').textContent=(note||defaultMsg)+(out?' · ⚠ outside artboard':'');
  $('grpBtn').style.display=(s&&s.parts&&subSel!==null&&s.id!==openId)?'flex':'none';
  $('axisPanel').style.display=(axisOpen&&sel)?'flex':'none';
  const sp=isCounterTarget(t)&&(s.id!==openId);
  $('sidePanel').style.display=sp?'flex':'none';
  if(sp&&document.activeElement!==$('sVal'))$('sVal').value=getCounterLabel(t);
}

$('grpBtn').onclick=()=>{
  subSel=null;
  note='Whole group selected';
  render();
};

let hist=[JSON.stringify([])],hi=0;
function updBtns(){$('undo').style.opacity=hi>0?1:.35;$('redo').style.opacity=hi<hist.length-1?1:.35}
function commit(){hist=hist.slice(0,hi+1);hist.push(JSON.stringify(shapes));if(hist.length>100)hist.shift();hi=hist.length-1;updBtns();save()}
function save(){try{localStorage.setItem('svglogo.v1',JSON.stringify({ver:2,shapes,nid,col:$('col').value,wid:$('wid').value}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('svglogo.v1')||'null');if(d&&Array.isArray(d.shapes)){shapes=d.shapes;if(d.ver!==2)shapes.forEach(s=>{delete s.rawOpen;(s.parts||[]).forEach(p=>delete p.rawOpen)});nid=d.nid||nid;if(d.col)$('col').value=d.col;if(d.wid)$('wid').value=d.wid;hist=[JSON.stringify(shapes)];hi=0}}catch(e){}}
addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
function restore(){shapes=JSON.parse(hist[hi]);save();if(!shapes.some(s=>s.id===sel)){sel=null;subSel=null}render();updBtns()}
$('undo').onclick=()=>{if(hi>0){hi--;restore()}};
$('redo').onclick=()=>{if(hi<hist.length-1){hi++;restore()}};
$('clr').onclick=()=>{if(!shapes.length)return;shapes=[];sel=null;subSel=null;openId=null;render();commit()};
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;if((e.key==='Delete'||e.key==='Backspace')&&sel)delSel()});
function delSel(){
  const s=get(sel);
  if(s&&s.parts&&subSel!==null&&s.parts.length>1){
    s.parts.splice(subSel,1);
    subSel=null;
    rebuildGroupBounds(s);
    render();commit();return;
  }
  shapes=shapes.filter(x=>x.id!==sel);sel=null;subSel=null;openId=null;render();commit()
}

let note='',openId=null;
function splitPts(pts){
  const g=[[]];
  pts.forEach(q=>q?g[g.length-1].push(q):g.push([]));
  return g.filter(x=>x.length>0);
}
function ensureParts(s){
  if(!s)return;
  if(s.parts&&s.parts.length)return;
  const groups=splitPts(s.pts);
  if(groups.length>1){
    s.parts=groups.map(p=>({pts:p,kind:s.kind||'open',poly:!!s.poly,closed:!!s.closed,sides:s.sides||0,color:s.color,sw:s.sw,rot:0}));
  }
}
function syncPtsFromParts(s){
  if(!s.parts)return;
  const out=[];
  s.parts.forEach((pt,idx)=>{
    if(idx>0)out.push(null);
    out.push(...pt.pts);
  });
  s.pts=out;
}
function rebuildGroupBounds(s){
  if(!s.parts||!s.parts.length)return;
  const worldParts=s.parts.map(pt=>({
    ...pt,
    wpts:pt.pts.map(q=>l2w(s,q[0]*s.w,q[1]*s.h)),
    wraw:pt.rawOpen&&pt.rawOpen.map(q=>l2w(s,q[0]*s.w,q[1]*s.h))
  }));
  const allW=worldParts.flatMap(p=>p.wpts);
  if(!allW.length)return;
  const xs=allW.map(q=>q[0]),ys=allW.map(q=>q[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const w=Math.max(x1-x0,24),h=Math.max(y1-y0,24),cx=(x0+x1)/2,cy=(y0+y1)/2;
  s.cx=cx;s.cy=cy;s.w=w;s.h=h;s.rot=0;
  s.parts=worldParts.map(p=>({
    pts:p.wpts.map(q=>[(q[0]-cx)/w,(q[1]-cy)/h]),
    kind:p.kind,poly:p.poly,closed:p.closed,sides:p.sides,rec:p.rec,orig:p.orig,
    color:p.color||s.color,sw:p.sw||s.sw,
    rawOpen:p.wraw&&p.wraw.map(q=>[(q[0]-cx)/w,(q[1]-cy)/h])
  }));
  syncPtsFromParts(s);
}

function getSubBox(s,part){
  const wpts=part.pts.map(q=>l2w(s,q[0]*s.w,q[1]*s.h));
  const xs=wpts.map(q=>q[0]),ys=wpts.map(q=>q[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  return{cx:(x0+x1)/2,cy:(y0+y1)/2,w:Math.max(x1-x0,20),h:Math.max(y1-y0,20),rot:0};
}

function endHit(s,p){const a=s.pts[0],b=s.pts[s.pts.length-1];if(!a||!b)return null;const A=l2w(s,a[0]*s.w,a[1]*s.h),B=l2w(s,b[0]*s.w,b[1]*s.h),da=Math.hypot(p[0]-A[0],p[1]-A[1]),db=Math.hypot(p[0]-B[0],p[1]-B[1]);if(Math.min(da,db)>24/V.k)return null;return da<db?'start':'end'}
function startExt(s,p,join){drag.mode='draw';drag.ext=s.id;drag.join=false;drag.rev=false;drag.pts=[p];drag.path=el('path',{fill:'none',stroke:$('col').value,'stroke-width':$('wid').value,'stroke-linecap':'round','stroke-linejoin':'round'},$('draft'))}
function resample(p,n){let L=0;const c=[0];for(let i=1;i<p.length;i++){L+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);c.push(L)}
  const o=[];let j=1;for(let k=0;k<n;k++){const t=L*k/(n-1);while(j<p.length-1&&c[j]<t)j++;const a=p[j-1],b=p[j],d=(c[j]-c[j-1])||1,f=Math.min(1,Math.max(0,(t-c[j-1])/d));o.push([a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f])}
  return[o,L]}
function rdp(p,e){if(p.length<3)return p;let m=0,k=0;for(let i=1;i<p.length-1;i++){const d=segDist(p[i],p[0],p[p.length-1]);if(d>m){m=d;k=i}}
  if(m<=e)return[p[0],p[p.length-1]];return rdp(p.slice(0,k+1),e).slice(0,-1).concat(rdp(p.slice(k),e))}
function fromWorld(s,wp){const wf=wp.filter(Boolean),xs=wf.map(q=>q[0]),ys=wf.map(q=>q[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const w=Math.max(x1-x0,24),h=Math.max(y1-y0,24),cx=(x0+x1)/2,cy=(y0+y1)/2;
  Object.assign(s,{cx,cy,w,h,rot:0,pts:wp.map(q=>q?[(q[0]-cx)/w,(q[1]-cy)/h]:null)})}
function circlePts(){const o=[];for(let i=0;i<=72;i++){const a=i/72*2*Math.PI;o.push([.5*Math.cos(a),.5*Math.sin(a)])}return o}
function regPts(n){const o=[];for(let i=0;i<=n;i++){const a=-Math.PI/2+i/n*2*Math.PI;o.push([.5*Math.cos(a),.5*Math.sin(a)])}return o}

function openArcPts(segs){
  const n=Math.max(1,Math.min(32,segs));
  const o=[];
  for(let i=0;i<=n;i++){
    const a=Math.PI*(1-i/n);
    o.push([.5*Math.cos(a),-.5*Math.sin(a)+.25]);
  }
  return o;
}

function adjustOpenSegments(t,delta,parentGroup){
  let pts=parentGroup?t.pts.map(q=>l2w(parentGroup,q[0]*parentGroup.w,q[1]*parentGroup.h)):t.pts.map(q=>l2w(get(sel),q[0]*get(sel).w,q[1]*get(sel).h));
  const fr=parentGroup||get(sel);
  if(!t.rawOpen&&pts.length>2){
    t.rawOpen=pts.map(p=>{const l=w2l(fr,p[0],p[1]);return[l[0]/fr.w,l[1]/fr.h]});
  }
  const rawW=t.rawOpen&&t.rawOpen.map(q=>l2w(fr,q[0]*fr.w,q[1]*fr.h));
  const curSegs=Math.max(1,pts.length-1);
  const closedRaw=!!rawW&&(()=>{let L=0;for(let i=1;i<rawW.length;i++)L+=Math.hypot(rawW[i][0]-rawW[i-1][0],rawW[i][1]-rawW[i-1][1]);return Math.hypot(rawW[0][0]-rawW[rawW.length-1][0],rawW[0][1]-rawW[rawW.length-1][1])<.15*L})();
  const nextSegs=Math.max(closedRaw?3:1,Math.min(360,curSegs+delta));
  if(nextSegs===curSegs)return;

  let newWpts=[];
  if(nextSegs===1&&!closedRaw){
    newWpts=[pts[0],pts[pts.length-1]];
  }else if(rawW){
    const[res]=resample(rawW,nextSegs+1);
    newWpts=res;
    if(closedRaw)newWpts[newWpts.length-1]=newWpts[0].slice();
  }else{
    const xs=pts.map(q=>q[0]),ys=pts.map(q=>q[1]);
    const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;
    const pw=Math.max(Math.max(...xs)-Math.min(...xs),24),ph=Math.max(Math.max(...ys)-Math.min(...ys),24);
    newWpts=openArcPts(nextSegs).map(u=>[cx+u[0]*pw,cy+u[1]*ph]);
  }

  if(parentGroup){
    t.pts=newWpts.map(q=>{const l=w2l(parentGroup,q[0],q[1]);return[l[0]/parentGroup.w,l[1]/parentGroup.h]});
    t.kind=nextSegs===1?'line':'open';
    t.poly=true;t.closed=false;t.sides=nextSegs;
    syncPtsFromParts(parentGroup);
    rebuildGroupBounds(parentGroup);
  }else{
    const s=get(sel);
    fromWorld(s,newWpts);
    s.kind=nextSegs===1?'line':'open';
    s.poly=true;s.closed=false;s.sides=nextSegs;
    if(rawW)s.rawOpen=rawW.map(q=>[(q[0]-s.cx)/s.w,(q[1]-s.cy)/s.h]);
  }
  note=nextSegs===1?'1 straight segment':nextSegs+' open segments';
  render();commit();
}

function setSides(n){
  const s=get(sel);if(!s)return;openId=null;n=Math.max(0,Math.min(360,n));
  {const isS=!!(s.parts&&subSel!==null&&s.parts[subSel]),tg=isS?s.parts[subSel]:s;
   const rw=tg.rawOpen&&tg.rawOpen.map(q=>l2w(s,q[0]*s.w,q[1]*s.h));
   if(rw&&rw.length>8){const r=recStroke(rw),rs=r.k==='circle'?0:(r.k==='poly'?r.sides:-1);
     if(rs===n){
       if(isS){tg.pts=r.w.map(q=>{const l=w2l(s,q[0],q[1]);return[l[0]/s.w,l[1]/s.h]});tg.kind=r.k;tg.poly=r.poly;tg.closed=true;tg.sides=r.sides||0;tg.orig=true;syncPtsFromParts(s);rebuildGroupBounds(s)}
       else if(r.k==='circle'){const e=r.ell;Object.assign(s,{cx:e.cx,cy:e.cy,w:2*e.Ax,h:2*e.By,rot:e.th*180/Math.PI,kind:'circle',poly:false,closed:true,sides:0,pts:circlePts(),orig:true})}
       else{fromWorld(s,r.w);Object.assign(s,{kind:'poly',poly:true,closed:true,sides:r.sides,orig:true})}
       if(!isS)s.rawOpen=rw.map(q=>{const l=w2l(s,q[0],q[1]);return[l[0]/s.w,l[1]/s.h]});
       note='Back to your original shape';render();commit();return}}}
  if(s.parts&&subSel!==null&&s.parts[subSel]){
    const part=s.parts[subSel];
    const sb=getSubBox(s,part);
    const unitPts=n?regPts(n):circlePts();
    const newWpts=unitPts.map(u=>[sb.cx+u[0]*sb.w,sb.cy+u[1]*sb.h]);
    part.pts=newWpts.map(q=>{const l=w2l(s,q[0],q[1]);return[l[0]/s.w,l[1]/s.h]});

function pt(e){const r=svg.getBoundingClientRect();return[(e.clientX-r.left-V.x)/V.k,(e.clientY-r.top-V.y)/V.k]}
function segDist(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}

function hitTest(p,ex){
  let best=null,bestSub=null,bs=18/V.k;
  for(const s of shapes){
    if(s.id===ex)continue;
    if(s.parts&&s.parts.length){
      s.parts.forEach((pt,idx)=>{
        const w=pt.pts.map(q=>l2w(s,q[0]*s.w,q[1]*s.h));
        let m=1e9;
        for(let i=0;i<w.length-1;i++)m=Math.min(m,segDist(p,w[i],w[i+1]));
        if(w.length===1)m=Math.hypot(p[0]-w[0][0],p[1]-w[0][1]);
        const sc=m-(pt.sw||s.sw)/2-(s.id===sel?10/V.k:0);
        if(sc<bs){bs=sc;best=s.id;bestSub=idx}
      });
    }else{
      const w=s.pts.map(q=>q?l2w(s,q[0]*s.w,q[1]*s.h):null);let m=1e9;
      for(let i=0;i<w.length-1;i++)if(w[i]&&w[i+1])m=Math.min(m,segDist(p,w[i],w[i+1]));
      if(w.length===1)m=Math.hypot(p[0]-w[0][0],p[1]-w[0][1]);
      const sc=m-s.sw/2-(s.id===sel?10/V.k:0);
      if(sc<bs){bs=sc;best=s.id;bestSub=null}
    }
  }
  return best?{id:best,sub:bestSub}:null;
}

svg.addEventListener('pointermove',e=>{

function end(e){

setProjName(proj.name);
go(proj.section,true);
